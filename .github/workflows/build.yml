name: Build Single HTML
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Updated from 20 to 24 for 2026 standards
          cache: 'npm'
          
      - name: Install and Build
        run: |
          npm install
          npm run build
          
      - name: Upload Single HTML File
        uses: actions/upload-artifact@v4
        with:
          name: My-Lovable-App
          path: dist/index.html
